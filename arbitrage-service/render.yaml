services:
  - type: web
    name: arbitrage-service
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm install
    startCommand: node src/server/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      # Toutes les autres variables (API_SECRET_KEY, JINA_API_KEY, BASE44_*, etc.)
      # doivent être renseignées manuellement dans l'onglet "Environment" de Render.
      # Voir .env.example pour la liste complète.
