name: Inventaire des marches (decouverte)
on:
  workflow_dispatch:
    inputs:
      books:
        description: Books a interroger (csv)
        default: 1xbet,congobet,betpawa,1win
      matches:
        description: Nombre de matchs a inventorier
        default: '2'
      min_books:
        description: Books minimum par match
        default: '2'
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Inventaire
        env:
          INV_BOOKS: ${{ inputs.books }}
          INV_MATCHES: ${{ inputs.matches }}
          INV_MIN_BOOKS: ${{ inputs.min_books }}
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
        run: node scripts/market-inventory.js
