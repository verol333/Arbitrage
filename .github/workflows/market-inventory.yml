name: Inventaire marchés (par book, lisible)
on: { workflow_dispatch: {} }
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Run inventory
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
        run: node scripts/market-inventory.js
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-inventory
          path: output/market-inventory.*
          retention-days: 60
      - name: Commit inventory to docs/
        if: success()
        run: |
          mkdir -p docs
          cp output/market-inventory.md docs/market-inventory.md
          cp output/market-inventory.json docs/market-inventory.json
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add docs/market-inventory.md docs/market-inventory.json
          git commit -m "inventaire marches auto-genere" || echo "no changes"
          git push origin HEAD:main
