name: Probe Live Audit
on:
  workflow_dispatch:
    inputs:
      match_search:
        description: 'Nom d''une equipe (ex: "Krumvir", "Grimsby") — chercher dans les matchs live'
        required: true
        type: string
      sport:
        description: 'Sport a tester'
        required: false
        default: 'football'
        type: choice
        options: [football, tennis, basket]
      wait_ms:
        description: 'Delai entre les 2 fetch (ms) pour detecter stale'
        required: false
        default: '8000'
        type: string

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: arbitrage-service
        run: npm install --no-audit --no-fund
      - name: Run live audit
        working-directory: /home/runner/work/Arbitrage/Arbitrage
        env:
          MATCH_SEARCH: ${{ inputs.match_search }}
          SPORT: ${{ inputs.sport }}
          WAIT_MS: ${{ inputs.wait_ms }}
          NODE_PATH: arbitrage-service/node_modules
          SCRAPE_DO_TOKEN: ${{ secrets.SCRAPE_DO_TOKEN }}
        run: node scripts/probe-live-audit.js
