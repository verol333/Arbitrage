name: Test Webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test webhook connectivity
        run: |
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: $WEBHOOK_SECRET" \
            -d '{
              "type": "arbitrage_alert",
              "scan_type": "test",
              "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",
              "count": 1,
              "opportunities": [{
                "match_label": "TEST FC vs VERIFY United",
                "team_home": "TEST FC",
                "team_away": "VERIFY United",
                "league": "Test League",
                "sport": "football",
                "market_family": "1X2",
                "leg_a_book": "1xbet",
                "leg_a_label": "1",
                "leg_a_odd": 3.50,
                "leg_b_book": "1win",
                "leg_b_label": "X2",
                "leg_b_odd": 1.35,
                "inverse_sum": 0.9269,
                "profit_pct": 7.31,
                "stake_a_pct": 27.4,
                "stake_b_pct": 72.6,
                "status": "live",
                "is_live": false
              }],
              "stats": { "test": true }
            }')
          echo "HTTP Status: $STATUS"
          echo "Response:"
          cat /tmp/response.txt
          echo ""
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "WEBHOOK OK"
          else
            echo "WEBHOOK FAILED (status $STATUS)"
            exit 1
          fi
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
