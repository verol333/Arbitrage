name: Probe Mapping Audit (tennis+basket per book)
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (root ESM)
        run: npm init -y && npm install --no-audit --no-fund ws got-scraping
      - name: Run mapping audit
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
        run: node scripts/probe-mapping-audit.js
