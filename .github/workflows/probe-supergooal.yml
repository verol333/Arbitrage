name: Probe SuperGooal (Meridianbet)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-supergooal.js
        env:
          SUPERGOOAL_TOKEN: ${{ secrets.SUPERGOOAL_TOKEN }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
