name: 1xBet tennis — anatomie du silence par set
on:
  workflow_dispatch:
    inputs:
      matches:
        description: Nombre de matchs tennis a sonder
        default: '25'
      horizon:
        description: Horizon en heures
        default: '48'
      where:
        description: Segment (head = grands tournois, tail = longue traine, all = reparti)
        default: head
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Sonde du silence 1xBet
        env:
          XS_MATCHES: ${{ inputs.matches }}
          XS_HORIZON: ${{ inputs.horizon }}
          XS_WHERE: ${{ inputs.where }}
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
        run: node scripts/xbet-tennis-silence.js
      - name: Commit rapport
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/xbet-tennis-silence.md
          git commit -m "Sonde silence 1xBet tennis" || echo "rien a committer"
          git push || echo "push impossible"
