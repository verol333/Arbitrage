name: Audit — Match Any Sport

on:
  workflow_dispatch:
    inputs:
      home:
        description: 'Équipe 1 (ex: Yunost Minsk)'
        required: true
      away:
        description: 'Équipe 2 (ex: Admiral Vladivostok)'
        required: true
      sport:
        description: 'Sport (football | tennis | basketball | hockey | volleyball)'
        required: true
        default: 'hockey'
      live:
        description: 'Live (1) ou prématch (0)'
        required: false
        default: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run audit
        working-directory: .
        run: node scripts/audit-match-any.js
        env:
          T_HOME: ${{ github.event.inputs.home }}
          T_AWAY: ${{ github.event.inputs.away }}
          T_SPORT: ${{ github.event.inputs.sport }}
          T_LIVE: ${{ github.event.inputs.live }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
