name: Scan pattern Luzern (DC X2 + H eur 1/X 0:1)
on: { workflow_dispatch: {} }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Run scanner
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
          TOP_MATCHES: '500'
          HORIZON_HOURS: '168'
          MATCH_BATCH: '20'
        run: node scripts/luzern-pattern-scanner.js
      - name: Commit report
        run: |
          git config user.email actions@github.com
          git config user.name "GitHub Actions"
          git add docs/luzern-pattern-scan.md
          git commit -m "luzern-pattern scan auto-genere" || echo "no changes"
          git push origin HEAD:main
