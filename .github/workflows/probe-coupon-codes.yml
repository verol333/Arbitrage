name: Probe Coupon Codes (7 books)
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install --no-save ws got-scraping
      - name: Run probe
        run: node scripts/probe-coupon-codes-all.js
