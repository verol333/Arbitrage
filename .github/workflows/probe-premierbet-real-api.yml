name: Probe — PremierBet REAL API (sports-api)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Audit 1win + Congobet (temp — 1win/congobet workflows pas encore indexés)
        working-directory: .
        run: |
          echo "===== 1WIN AUDIT ====="
          node scripts/audit-onewin.js || echo "onewin FAILED"
          echo ""
          echo "===== CONGOBET AUDIT ====="
          node scripts/audit-congobet.js || echo "congobet FAILED"
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
