name: Audit — Tennis Markets

on:
  workflow_dispatch:
    inputs:
      home:
        description: 'Joueur 1 (ex: Charles Broom)'
        required: true
        default: 'Charles Broom'
      away:
        description: 'Joueur 2 (ex: Toby Samuel)'
        required: true
        default: 'Toby Samuel'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules at repo root
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run tennis audit
        working-directory: .
        run: node scripts/audit-tennis-markets.js
        env:
          T_HOME: ${{ github.event.inputs.home }}
          T_AWAY: ${{ github.event.inputs.away }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
