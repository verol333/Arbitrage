name: Probe — Sportcash Endpoints

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - name: Install dependencies
        run: npm install --production
      - name: Link node_modules at repo root
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run probe
        run: node scripts/probe-sportcash-deep.js > /tmp/probe.json 2> /tmp/probe.err.log || echo "exit $?"
      - name: Show stderr
        if: always()
        run: cat /tmp/probe.err.log || true
      - name: Show FULL output
        if: always()
        run: |
          echo "=== PROBE START ==="
          cat /tmp/probe.json || true
          echo "=== PROBE END ==="
