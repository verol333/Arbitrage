name: Probe — PremierBet REAL API #2 (via Scrape.do)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Probe #2
        working-directory: .
        run: node scripts/probe-premierbet-real-api-2.js
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
