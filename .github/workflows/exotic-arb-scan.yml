name: Scanner marchés inhabituels (penalty/cartons/corners/joueurs)
on: { workflow_dispatch: {} }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Run exotic scanner
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
          TOP_MATCHES: '4'
        run: node scripts/exotic-arb-scanner.js
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exotic-arb-scan
          path: output/exotic-arb-scan.json
          retention-days: 30
