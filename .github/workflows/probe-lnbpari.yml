name: Probe LNB Pari
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm i ws@8.18.0
      - name: Probe
        run: node arbitrage-service/probe-lnbpari.mjs
