name: Probe — Winner.bet (Playwright)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}-playwright
      - run: npm install --production && npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Link node_modules at repo root
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run playwright probe
        working-directory: .
        run: node scripts/probe-winner-playwright.js
