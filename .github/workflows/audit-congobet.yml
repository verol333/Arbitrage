name: Audit — Congobet Football

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run audit
        working-directory: .
        run: node scripts/audit-congobet.js
