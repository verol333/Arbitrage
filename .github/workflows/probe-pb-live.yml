name: probe-pb-live
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install dependencies
        run: npm install
      - name: Dependance ws a la racine
        working-directory: .
        run: npm install ws got-scraping --no-save
      - name: Sonde horaire PremierBet live
        run: node probe-pb-live.mjs
