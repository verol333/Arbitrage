name: Probe Maxibet Discovery
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y && npm install --no-audit --no-fund ws got-scraping
      - run: node scripts/probe-maxibet-discovery.js
