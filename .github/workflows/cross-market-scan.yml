name: Cross-Market Partition Scanner
on:
  workflow_dispatch:
    inputs:
      matches:
        description: 'Nombre de matchs a scanner (max)'
        required: false
        default: '200'
      horizon:
        description: 'Horizon en heures'
        required: false
        default: '48'
      batch:
        description: 'Taille de batch (parallelisme)'
        required: false
        default: '15'
      verify:
        description: 'Verify mode: dump N premiers matchs (0=scan normal)'
        required: false
        default: '0'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Run cross-market scanner
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
          TOP_MATCHES: ${{ inputs.matches }}
          HORIZON_HOURS: ${{ inputs.horizon }}
          MATCH_BATCH: ${{ inputs.batch }}
          VERIFY: ${{ inputs.verify }}
        run: node scripts/cross-market-scanner.js
      - name: Commit report
        if: ${{ inputs.verify == '0' }}
        run: |
          git config user.email actions@github.com
          git config user.name "GitHub Actions"
          git add docs/cross-market-scan.md
          git commit -m "cross-market scan auto-genere" || echo "no changes"
          git push origin HEAD:${{ github.ref_name }}
