name: Probe 1win Raw
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y && npm install --no-audit --no-fund ws got-scraping
      - run: node scripts/probe-1win-raw.js
