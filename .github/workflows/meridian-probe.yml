name: Meridian Probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "=== data API reachability (online-rr) ==="
          curl -s -w "\nHTTP %{http_code}\n" "https://online-rr.meridianbet.com/betshop/api/v1/standard/sport/58/leagues?page=0&time=ALL" -A "Mozilla/5.0" | head -c 300; echo
          echo "=== microservice/token on online-rr ==="
          curl -s -w "\nHTTP %{http_code}\n" "https://online-rr.meridianbet.com/microservice/token" -A "Mozilla/5.0" | head -c 400; echo
          echo "=== auth.meridianbet.com clients probe ==="
          for p in /oauth/clients /api/clients /betshop/api/v1/standard/client /microservice/token; do
            echo "--- auth$p ---"
            curl -s -w " HTTP %{http_code}\n" "https://auth.meridianbet.com$p" -A "Mozilla/5.0" -H "origin: https://supergooal.cg" | head -c 300; echo
          done
          echo "=== try client_credentials with betshop params ==="
          for cid in web-congo web-cg congo-web supergooal meridian-cg; do
            echo "--- $cid ---"
            curl -s -w " HTTP %{http_code}\n" -X POST https://auth.meridianbet.com/oauth/token \
              -H "content-type: application/x-www-form-urlencoded" -H "origin: https://supergooal.cg" -H "referer: https://supergooal.cg/" \
              --data "grant_type=client_credentials&client_id=$cid&client_secret=11356bde976a2e0bfe4018a9c3c12e3774a4b37a&betshop_id=100644&market_id=100131&platform=WEB_DESKTOP&company_id=100005" | head -c 200; echo
          done
          true
