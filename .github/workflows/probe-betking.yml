name: Probe BetKing
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Probe
        run: node arbitrage-service/probe-betking.mjs
