name: Audit — Sportcash Football

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run audit sportcash
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-sportcash.js
      - name: Probe sportcash catalog endpoints
        working-directory: .
        continue-on-error: true
        run: node scripts/probe-sportcash-catalog.js
      - name: Audit yellowbet prematch
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-yellowbet-prematch.js
      - name: Audit onewin BTTS (hacken vs aik)
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-onewin-btts.js 37642888
      - name: Audit yellowbet LIVE
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-yellowbet-live.js
      - name: Audit croisé LIVE match Togo Burkina
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-cross-live-match.js
      - name: Audit LIVE full YB + BM
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-live-full.js
      - name: Sanity 1X2 LIVE (YB + BM) — cotes vs score
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-live-1x2-sanity.js
      - name: Audit BetMomo PREMATCH 1re mi-temps (cotes vs raw)
        working-directory: .
        continue-on-error: true
        run: node scripts/audit-betmomo-prematch-ht.js
