name: Foot - Solveur par scenarios
on:
  workflow_dispatch:
    inputs:
      matches:
        description: 'Nombre de matchs a scanner'
        required: false
        default: '10'
      minProfit:
        description: 'Profit garanti minimal en %'
        required: false
        default: '0.5'
      iter:
        description: 'Iterations de l optimiseur'
        required: false
        default: '600'
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Solve
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
          TOP_MATCHES: ${{ inputs.matches }}
          MIN_PROFIT: ${{ inputs.minProfit }}
          ITER: ${{ inputs.iter }}
        run: node scripts/scenario-solver.js
      - name: Commit rapport
        run: |
          git config user.email actions@github.com
          git config user.name "GitHub Actions"
          git add docs/scenario-solver.md
          git commit -m "solveur par scenarios" || echo "aucun changement"
          git push origin HEAD:${{ github.ref_name }}
