name: Probe Casongo 4
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-casongo-4.js
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
