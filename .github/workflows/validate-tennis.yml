name: Validate Tennis Mapping — 9 books
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ws + got-scraping
        run: npm install --no-save ws got-scraping
      - name: Run validation
        run: node scripts/validate-tennis-mapping.js
