name: Arbitrage — Scan Prématch

# Toutes les 10 minutes — repo PUBLIC = minutes illimitées.
# Code minifié dans dist/action.min.js — illisible, secrets chiffrés.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  prematch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}

      - name: Install dependencies
        run: npm install --production

      - name: Run prematch scan
        run: node dist/action.min.js prematch
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
          BASE44_SERVICE_KEY: ${{ secrets.BASE44_SERVICE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          MIN_PROFIT_PREMATCH: ${{ secrets.MIN_PROFIT_PREMATCH }}
          HORIZON_HOURS: '72'
          MAX_MATCHES: '600'
          SCAN_SPORTS: 'football'
