name: Arbitrage — Scan Prématch

# Boucle interne : chaque creneau (6 par jour, 350min chacun) execute un scan
# prematch toutes les 5 min → couverture 24/7 garantie. Le */5 * * * * cron
# etait throttle par GitHub Actions (1 run toutes les 2-3h au lieu de toutes
# les 5 min), d'ou passage au meme design que arbitrage-live.yml.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durée du scan en minutes (max 350)'
        required: false
        default: '55'

  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

jobs:
  prematch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}

      - name: Install dependencies
        run: npm install --production

      - name: Run prematch scan loop
        run: node dist/action.min.js prematch
        env:
          # Cron schedule : 350min (couvre 24/7 via 6 créneaux). Manuel : 55min (test).
          PREMATCH_DURATION_MINUTES: ${{ github.event.inputs.duration || (github.event_name == 'schedule' && '350' || '55') }}
          PREMATCH_INTERVAL_MS: '300000'
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
          BASE44_SERVICE_KEY: ${{ secrets.BASE44_SERVICE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          MIN_PROFIT_PREMATCH: ${{ secrets.MIN_PROFIT_PREMATCH }}
          HORIZON_HOURS: '72'
          MAX_MATCHES: '5000'
          SCAN_SPORTS: 'football,tennis,basket'
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
