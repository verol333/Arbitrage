name: Arbitrage — Scan Live (15s)

# Scan live : boucle interne toutes les 15 secondes pendant X minutes.
# Déclenchement :
#   1. Manuel (bouton "Run workflow" sur GitHub) — vous choisissez la durée.
#   2. Automatique aux heures de match (18h-22h UTC, configurable ci-dessous).
#
# Budget privé (2000 min/mois) :
#   - 4 créneaux auto × 55 min = 220 min/jour ≈ 6600 min/mois ❌ trop
#   - SOLUTION : ne garder que 1-2 créneaux auto + le reste en manuel.
#   - Ajustez les lignes "cron" ci-dessous selon vos besoins.
#
# 💡 Sur un repo PUBLIC, les minutes GitHub Actions sont ILLIMITÉES.
#    Vos secrets restent chiffrés et invisibles même sur un repo public.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durée du scan en minutes (max 350)'
        required: false
        default: '30'

  # Décommentez les créneaux que vous voulez activer :
  # schedule:
  #   - cron: '0 17 * * *'   # 17h UTC = 18h Paris
  #   - cron: '0 19 * * *'   # 19h UTC = 20h Paris

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}

      - name: Install dependencies
        run: npm install --production

      - name: Run live scan loop (every 15s)
        run: node src/runners/github-action.js live
        env:
          SCAN_DURATION_MINUTES: ${{ github.event.inputs.duration || '55' }}
          LIVE_INTERVAL_MS: '15000'
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
          BASE44_SERVICE_KEY: ${{ secrets.BASE44_SERVICE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          MIN_PROFIT_LIVE: ${{ secrets.MIN_PROFIT_LIVE }}
          MAX_MATCHES: '100'
