name: Arbitrage — Scan Live (7s)

# Scan live : boucle interne toutes les 7 secondes pendant X minutes.
# Repo PUBLIC = minutes ILLIMITÉES. Secrets restent chiffrés.
# Code minifié dans dist/action.min.js — illisible pour un visiteur.
#
# 6 créneaux automatiques répartis sur 24h.
# Chaque créneau tourne 350 min (~5h50), puis le suivant prend le relais.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durée du scan en minutes (max 350)'
        required: false
        default: '55'

  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
    - cron: '0 18 * * *'
    - cron: '0 22 * * *'

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}

      - name: Install dependencies
        run: npm install --production

      - name: Run live scan loop (every 7s)
        run: node dist/action.min.js live
        env:
          # Cron schedule : 350min (couvre 24/7 via 6 créneaux). Manuel : 5min (test).
          SCAN_DURATION_MINUTES: ${{ github.event.inputs.duration || (github.event_name == 'schedule' && '350' || '5') }}
          LIVE_INTERVAL_MS: '7000'
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          BASE44_API_URL: ${{ secrets.BASE44_API_URL }}
          BASE44_SERVICE_KEY: ${{ secrets.BASE44_SERVICE_KEY }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          MIN_PROFIT_LIVE: ${{ secrets.MIN_PROFIT_LIVE }}
          MAX_MATCHES: '150'
          SCAN_SPORTS: 'football,tennis,basketball'
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
