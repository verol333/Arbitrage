name: Foot - Sonde marche combine DC+BTTS
on:
  workflow_dispatch:
    inputs:
      matches:
        description: 'Nombre de matchs populaires a sonder'
        required: false
        default: '12'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Probe
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
          TOP_MATCHES: ${{ inputs.matches }}
        run: node scripts/dc-btts-probe.js
      - name: Commit rapport
        run: |
          git config user.email actions@github.com
          git config user.name github-actions
          git add docs/dc-btts-probe.md
          git commit -m "chore: rapport sonde DC+BTTS" || echo "rien a committer"
          git push
