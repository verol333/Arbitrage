name: Probe 1xBet Basket Raw
on:
  workflow_dispatch:
    inputs:
      match_id:
        description: 'Match ID 1xBet (ex: 742286023 pour Chicago Sky vs Indiana Fever)'
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm init -y && npm install --no-audit --no-fund ws got-scraping
      - name: Run raw probe
        env:
          MATCH_ID: ${{ inputs.match_id }}
        run: node scripts/probe-xbet-basket-raw.js
