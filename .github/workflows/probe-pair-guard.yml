name: Two-sided market floor gate
on:
  workflow_dispatch:
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node arbitrage-service/probe-pair-guard.mjs
