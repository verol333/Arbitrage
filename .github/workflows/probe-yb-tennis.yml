name: Probe YellowBet Tennis — Cartographie markets
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install got-scraping
        run: npm install --no-save got-scraping
      - name: Probe YellowBet tennis mapping
        run: node scripts/probe-yb-tennis-map.js
