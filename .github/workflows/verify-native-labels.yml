name: Verify Native Labels
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps + symlink node_modules to repo root
        run: |
          cd arbitrage-service
          npm ci --no-audit --no-fund
          cd ..
          ln -sfn arbitrage-service/node_modules node_modules
      - run: node scripts/verify-native-labels.js
