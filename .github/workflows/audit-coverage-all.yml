name: Audit — Couverture matchs+marches (tous books, tous sports)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit-coverage-all.js'
      - '.github/workflows/audit-coverage-all.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run audit
        working-directory: .
        run: |
          mkdir -p probe-results
          node scripts/audit-coverage-all.js 2>&1 | tee probe-results/audit-coverage.log
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          HORIZON_HOURS: '72'
      - name: Commit log
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/audit-coverage.log
          git commit -m "Audit couverture run ${{ github.run_id }}" || echo "nothing"
          git push || true
