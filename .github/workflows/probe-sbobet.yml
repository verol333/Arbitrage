name: Sonde SBOBET
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in 1 2 3; do curl -s -o p.html -w "%{http_code} %{size_download}\n" -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124" https://www.sbobet.com/euro/live-betting/football; head -c 200 p.html; echo; grep -c "'oev'" p.html; grep -c "setToken('site'" p.html; sleep 2; done
