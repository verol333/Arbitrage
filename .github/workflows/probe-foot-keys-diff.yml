name: Probe Foot Keys Diff
on:
  workflow_dispatch:
    inputs:
      match_search:
        description: 'Nom d''une equipe foot (ex: "Norwich", "Barcelona")'
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm init -y && npm install --no-audit --no-fund ws got-scraping
      - env:
          MATCH_SEARCH: ${{ inputs.match_search }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
        run: node scripts/probe-foot-keys-diff.js
