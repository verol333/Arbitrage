name: Probe — Byparr Cloudflare Bypass
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - name: Wait for Byparr
        run: |
          for i in {1..60}; do
            if curl -sf http://localhost:8191/ >/dev/null 2>&1 || curl -sf http://localhost:8191/docs >/dev/null 2>&1; then
              echo "✅ Byparr ready after ${i}s"
              curl -s http://localhost:8191/docs | head -5
              break
            fi
            sleep 2
          done

      - name: Test 1 — BetPawa homepage via Byparr
        run: |
          echo "=== Testing BetPawa.cg homepage via Byparr ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://www.betpawa.cg/","maxTimeout":90000,"returnOnlyCookies":false}' \
            > /tmp/bp_home.json
          echo "Response size: $(wc -c < /tmp/bp_home.json) bytes"
          jq -r '.status,.message' /tmp/bp_home.json
          jq -r '.solution.status' /tmp/bp_home.json
          jq -r '.solution.userAgent' /tmp/bp_home.json
          echo "Cookies count:"
          jq '.solution.cookies | length' /tmp/bp_home.json
          echo "cf_clearance present:"
          jq '.solution.cookies[] | select(.name=="cf_clearance") | .value' /tmp/bp_home.json
          echo "HTML preview (first 500 chars):"
          jq -r '.solution.response' /tmp/bp_home.json | head -c 500
          echo ""
          echo "Has 'Just a moment' (CF challenge) in body:"
          jq -r '.solution.response' /tmp/bp_home.json | grep -c "Just a moment" || echo 0

      - name: Test 2 — BetPawa API endpoint (upcoming events) via Byparr
        run: |
          echo "=== Testing BetPawa API /api/sportsbook/v3/events/list/by-query ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://www.betpawa.cg/api/sportsbook/v3/events/list/by-query?marketId=1X2&categoryId=2&take=10","maxTimeout":90000}' \
            > /tmp/bp_api.json
          echo "API status: $(jq -r '.solution.status' /tmp/bp_api.json)"
          echo "Response size: $(jq -r '.solution.response' /tmp/bp_api.json | wc -c)"
          echo "First 300 chars of body:"
          jq -r '.solution.response' /tmp/bp_api.json | head -c 300
          echo ""
          echo "Is JSON?"
          jq -r '.solution.response' /tmp/bp_api.json | head -c 20 | grep -c '{' || echo 0

      - name: Test 3 — Casongo via Byparr (Velisports auth wall)
        run: |
          echo "=== Testing Casongo /WebSite/GetPrematchTree?SportId=1 ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://casongo.cg/","maxTimeout":90000}' \
            > /tmp/cs_home.json
          echo "Home status: $(jq -r '.solution.status' /tmp/cs_home.json)"
          jq '.solution.cookies | length' /tmp/cs_home.json
          jq -r '.solution.response' /tmp/cs_home.json | head -c 300
          echo ""

      - name: Test 4 — SuperGooal (Meridianbet Congo) via Byparr
        run: |
          echo "=== Testing SuperGooal ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://supergooal.cg/fr/pari","maxTimeout":90000}' \
            > /tmp/sg.json
          echo "Status: $(jq -r '.solution.status' /tmp/sg.json)"
          jq -r '.solution.response' /tmp/sg.json | head -c 300
          echo ""
          echo "Is Cloudflare challenge?"
          jq -r '.solution.response' /tmp/sg.json | grep -c "Just a moment\|challenge-platform" || echo 0
