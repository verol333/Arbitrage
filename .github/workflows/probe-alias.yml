name: probe-alias
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Tests du rapprochement
        run: node --test src/core/matching.test.mjs || true
      - name: Alias de traduction
        run: node arbitrage-service/probe-alias.mjs
