name: Probe betclic
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      - run: node probe-betclic.mjs
