name: Probe Betclic Sports
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe
        run: node arbitrage-service/probe-betclic-sports.mjs
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
