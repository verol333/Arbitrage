name: Audit Book (marches manquants + counts sport)
on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Book a auditer (xbet|congobet|apollo|betmomo|casongo)'
        required: true
        default: 'xbet'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        working-directory: arbitrage-service
        run: npm install --production --no-audit --no-fund
      - name: Symlink node_modules a la racine
        run: ln -sfn arbitrage-service/node_modules node_modules
      - run: node scripts/audit-${{ github.event.inputs.book }}.js
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
