name: Audit Book (marches manquants + counts sport)
on:
  workflow_dispatch:
    inputs:
      book:
        description: 'Book a auditer (betpawa|onewin|premierbet|sportybet|yellowbet)'
        required: true
        default: 'betpawa'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/audit-${{ github.event.inputs.book }}.js
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
