name: Scan TENNIS Only (validation)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/scan-tennis-only.js'
      - '.github/workflows/scan-tennis-only.yml'
      - 'src/bookmakers/**'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - name: Install deps
        run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run tennis-only scan
        working-directory: .
        run: |
          mkdir -p probe-results
          node scripts/scan-tennis-only.js 2>&1 | tee probe-results/scan-tennis.log || true
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          MIN_PROFIT_PREMATCH: ${{ secrets.MIN_PROFIT_PREMATCH }}
          HORIZON_HOURS: '72'
          MAX_MATCHES: '5000'
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
      - name: Commit results
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Trim log to last 800 lines pour eviter commits enormes
          if [ -f probe-results/scan-tennis.log ]; then
            tail -n 800 probe-results/scan-tennis.log > probe-results/scan-tennis.tail.log
            mv probe-results/scan-tennis.tail.log probe-results/scan-tennis.log
            git add probe-results/scan-tennis.log
            git commit -m "SCAN tennis run ${{ github.run_id }}" || echo "nothing"
            git push || true
          fi
