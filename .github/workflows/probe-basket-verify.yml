name: Probe Basket Verify
on:
  workflow_dispatch:
    inputs:
      top_n:
        description: 'Nombre d''opps a verifier (top N par profit)'
        required: false
        default: '8'
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps (root level for ESM)
        run: npm init -y && npm install --no-audit --no-fund ws got-scraping
      - name: Run basket verify probe
        env:
          MIN_PROFIT_PREMATCH: '0.5'
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
        run: node scripts/probe-basket-verify.js ${{ inputs.top_n }}
