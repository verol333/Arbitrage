name: Chutes de cote — virtuel Megapari (1 s)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durée en minutes (max 350)'
        required: false
        default: '10'
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 6 * * *'
    - cron: '0 12 * * *'
    - cron: '0 18 * * *'

concurrency:
  group: odds-drops
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Veille des cotes chaque seconde
        run: node drops/watch.mjs
        env:
          DURATION_MINUTES: ${{ github.event.inputs.duration || '355' }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
