name: Audit Volleyball Markets (7 books)
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Byparr
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:8191/docs >/dev/null 2>&1; then
              echo "OK Byparr ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Probe Betclic API CDN via Byparr
        run: |
          test_json() {
            local label="$1"; local url="$2"
            echo ""
            echo "=== $label ==="
            curl -s -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d "{\"cmd\":\"request.get\",\"url\":\"$url\",\"maxTimeout\":30000}" \
              > /tmp/probe.json 2>&1 || { echo "curl failed"; return; }
            local http=$(jq -r '.solution.status' /tmp/probe.json 2>/dev/null)
            local size=$(jq -r '.solution.response' /tmp/probe.json 2>/dev/null | wc -c)
            echo "  HTTP=$http size=${size}b"
            # Extraire le JSON du body (Byparr wrap dans HTML)
            jq -r '.solution.response' /tmp/probe.json 2>/dev/null \
              | sed -n 's/.*<pre>\(.*\)<\/pre>.*/\1/p' | head -c 800
            echo ""
          }
          QP="application=2&countrycode=fr&language=fr&sitecode=frfr"
          BASE="https://offer.cdn.betclic.fr/api/pub/v2"

          # Étape 1 : lister tous les sports
          test_json "sports list" "${BASE}/sports?${QP}"

          # Étape 2 : sport football = probable id=1
          test_json "sport 1 (probable football)" "${BASE}/sports/1?${QP}"
          test_json "sport 1 competitions" "${BASE}/sports/1/competitions?${QP}"

          # Étape 3 : test v3 aussi
          BASE3="https://offer.cdn.betclic.fr/api/pub/v3"
          test_json "v3 sports/1" "${BASE3}/sports/1?${QP}"
          test_json "v3 top matches" "${BASE3}/top-matches?${QP}&sportId=1"
          test_json "v3 sport events" "${BASE3}/sports/1/events?${QP}"

          # Étape 4 : essai endpoint direct compétition connue (Ligue 1)
          # Note : compId 432 mentionné dans un exemple public de search
          test_json "competition 432 (exemple)" "${BASE}/competitions/432?${QP}&forceCompetitionInfo=true"

          # Étape 5 : endpoint search + match direct
          test_json "matches list" "${BASE}/matches?${QP}&sportId=1"
          test_json "events list" "${BASE}/events?${QP}&sportId=1"
