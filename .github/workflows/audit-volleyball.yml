name: Audit Volleyball Markets (7 books)
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Byparr
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:8191/docs >/dev/null 2>&1; then
              echo "OK Byparr ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Test BetPawa homepage via Byparr
        run: |
          echo "=== BetPawa.cg homepage ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://www.betpawa.cg/","maxTimeout":90000}' \
            > /tmp/bp.json 2>&1 || echo "curl failed"
          echo "size: $(wc -c < /tmp/bp.json)"
          jq -r '.status, .message, .solution.status, .solution.userAgent' /tmp/bp.json 2>&1 || cat /tmp/bp.json
          echo "cookies: $(jq '.solution.cookies | length' /tmp/bp.json 2>/dev/null)"
          echo "cf_clearance: $(jq -r '.solution.cookies[] | select(.name=="cf_clearance") | .value' /tmp/bp.json 2>/dev/null | head -c 40)"
          echo "--- html preview ---"
          jq -r '.solution.response' /tmp/bp.json 2>/dev/null | head -c 500
          echo ""
          echo "CF challenge markers: $(jq -r '.solution.response' /tmp/bp.json 2>/dev/null | grep -Ec 'Just a moment|challenge-platform' || echo 0)"

      - name: Test BetPawa API via Byparr
        run: |
          echo "=== BetPawa API events list ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://www.betpawa.cg/api/sportsbook/v3/events/list/by-query?marketId=1X2&categoryId=2&take=10","maxTimeout":90000}' \
            > /tmp/bp_api.json
          echo "http status: $(jq -r '.solution.status' /tmp/bp_api.json 2>/dev/null)"
          jq -r '.solution.response' /tmp/bp_api.json 2>/dev/null | head -c 400
          echo ""

      - name: Test Casongo via Byparr
        run: |
          echo "=== Casongo.cg homepage ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://casongo.cg/","maxTimeout":90000}' \
            > /tmp/cs.json
          echo "http status: $(jq -r '.solution.status' /tmp/cs.json 2>/dev/null)"
          echo "cookies count: $(jq '.solution.cookies | length' /tmp/cs.json 2>/dev/null)"
          jq -r '.solution.response' /tmp/cs.json 2>/dev/null | head -c 400
          echo ""

      - name: Test SuperGooal via Byparr
        run: |
          echo "=== SuperGooal.cg ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://supergooal.cg/fr/pari","maxTimeout":90000}' \
            > /tmp/sg.json
          echo "http status: $(jq -r '.solution.status' /tmp/sg.json 2>/dev/null)"
          jq -r '.solution.response' /tmp/sg.json 2>/dev/null | head -c 400
          echo ""
          echo "CF challenge markers: $(jq -r '.solution.response' /tmp/sg.json 2>/dev/null | grep -Ec 'Just a moment|challenge-platform' || echo 0)"
