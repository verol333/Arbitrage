name: Audit Volleyball Markets (7 books)
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        working-directory: arbitrage-service
        run: npm install --production --no-audit --no-fund
      - name: Symlink node_modules
        run: ln -sfn arbitrage-service/node_modules node_modules

      - name: Wait for Byparr
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:8191/docs >/dev/null 2>&1; then
              echo "OK Byparr ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Probe books via Byparr
        run: |
          test_url() {
            local label="$1"; local url="$2"
            echo ""
            echo "=== $label ==="
            curl -s -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d "{\"cmd\":\"request.get\",\"url\":\"$url\",\"maxTimeout\":60000}" \
              > /tmp/probe.json 2>&1 || { echo "curl failed"; return; }
            local http=$(jq -r '.solution.status' /tmp/probe.json 2>/dev/null)
            local size=$(jq -r '.solution.response' /tmp/probe.json 2>/dev/null | wc -c)
            local cf=$(jq -r '.solution.response' /tmp/probe.json 2>/dev/null | grep -Ec 'Just a moment|challenge-platform|cf-mitigated' || echo 0)
            local cookies=$(jq '.solution.cookies | length' /tmp/probe.json 2>/dev/null)
            echo "  HTTP=$http size=${size}b cookies=$cookies CF=$cf"
            jq -r '.solution.response' /tmp/probe.json 2>/dev/null | head -c 250 | tr -d '\n'
            echo ""
          }
          test_url "Betclic.fr" "https://www.betclic.fr/"
          test_url "Betclic.pt" "https://www.betclic.pt/"
          test_url "LNBPari.bj" "https://www.lnbpari.bj/"
          test_url "LNBPari.com" "https://www.lnbpari.com/"
          test_url "LNBPari (paris.lnb.bj)" "https://paris.lnb.bj/"
          test_url "LNBPari (bet.lnb.bj)" "https://bet.lnb.bj/"
          test_url "BetPawa API v2 events" "https://www.betpawa.cg/api/sportsbook/v2/categories/games?marketId=1X2&categoryId=2&take=10"
          test_url "Casongo API GetPrematchTree" "https://casongo.cg/WebSite/GetPrematchTree?SportId=1"

      - name: Probe PremierBet volleyball + YellowBet LIVE
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
        run: node scripts/audit-volleyball-markets.js
