name: Audit Volleyball Markets (7 books)
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Byparr
        run: for i in {1..90}; do curl -sf http://localhost:8191/docs >/dev/null 2>&1 && break; sleep 2; done

      - name: Fetch SuperGooal HTML + extract JS URLs
        run: |
          echo "=== Fetch supergooal.cg/fr/pari via Byparr ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://supergooal.cg/fr/pari","maxTimeout":60000}' \
            > /tmp/sg.json
          jq -r '.solution.response' /tmp/sg.json > /tmp/sg.html
          echo "HTML size: $(wc -c < /tmp/sg.html)"

          echo ""
          echo "=== JS files trouvés ==="
          grep -oE 'src="[^"]+\.js"' /tmp/sg.html | sed 's/^src="//;s/"$//' | sort -u > /tmp/jsfiles.txt
          cat /tmp/jsfiles.txt
          # Ajoute le prefix supergooal.cg si relatif
          echo ""
          echo "=== JS avec prefix ==="
          while read js; do
            if [[ "$js" == /* ]] || [[ "$js" != http* ]]; then
              echo "https://supergooal.cg/fr/pari/$js"
            else
              echo "$js"
            fi
          done < /tmp/jsfiles.txt > /tmp/jsurls.txt
          cat /tmp/jsurls.txt

          echo ""
          echo "=== Grep dans HTML : oauth/token/api paths ==="
          grep -oE 'oauth[a-zA-Z0-9/_\-\.]*' /tmp/sg.html | sort -u | head -20
          grep -oE 'client[_-]id[^"]*"[^"]+' /tmp/sg.html | head -5
          grep -oE '["/]api/v?[0-9]?/[a-zA-Z0-9/_\-]+' /tmp/sg.html | sort -u | head -30
          grep -oE '(access_token|Bearer|Authorization)' /tmp/sg.html | sort -u | head -5

      - name: Fetch main JS bundle et cherche endpoints
        run: |
          # Fetch les 3 premiers JS via Byparr
          I=0
          while IFS= read -r url && [ "$I" -lt 3 ]; do
            I=$((I+1))
            echo ""
            echo "=== JS $I: $url ==="
            curl -s -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d "{\"cmd\":\"request.get\",\"url\":\"$url\",\"maxTimeout\":30000}" \
              > /tmp/js.json
            jq -r '.solution.response' /tmp/js.json > /tmp/js.txt 2>/dev/null
            echo "  size: $(wc -c < /tmp/js.txt)"

            echo "  === oauth/token paths ==="
            grep -oE '["/]oauth/[a-zA-Z0-9/_\-]+' /tmp/js.txt | sort -u | head -10 || echo "  (none)"
            grep -oE '["/]auth/[a-zA-Z0-9/_\-]+' /tmp/js.txt | sort -u | head -10 || echo "  (none)"

            echo "  === API paths ==="
            grep -oE '/betshop/api/v?[0-9]?/[a-zA-Z0-9/_\-]+' /tmp/js.txt | sort -u | head -15 || echo "  (none)"
            grep -oE '/api/v?[0-9]?/[a-zA-Z0-9/_\-]+' /tmp/js.txt | sort -u | head -20 || echo "  (none)"

            echo "  === client_id / secret ==="
            grep -oE 'client[_-]?id["'\'':,\ ]*["'\'']\?[a-zA-Z0-9_\-]{5,}' /tmp/js.txt | head -3 || echo "  (none)"
            grep -oE 'grant_type["'\'':,\ ]*["'\''][a-z_]+' /tmp/js.txt | head -3 || echo "  (none)"

            echo "  === URLs meridianbet ==="
            grep -oE 'https?://[a-zA-Z0-9\.\-]+\.meridianbet\.com/[a-zA-Z0-9/_\-]*' /tmp/js.txt | sort -u | head -20 || echo "  (none)"
          done < /tmp/jsurls.txt
