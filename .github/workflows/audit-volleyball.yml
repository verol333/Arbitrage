name: Audit Volleyball Markets (7 books)
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Byparr
        run: for i in {1..90}; do curl -sf http://localhost:8191/docs >/dev/null 2>&1 && break; sleep 2; done

      - name: Probe Meridianbet API endpoints
        run: |
          test_url() {
            local label="$1"; local url="$2"
            echo ""; echo "=== $label ==="
            curl -s -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d "{\"cmd\":\"request.get\",\"url\":\"$url\",\"maxTimeout\":30000}" \
              > /tmp/p.json 2>&1 || { echo "curl failed"; return; }
            echo "  HTTP=$(jq -r '.solution.status' /tmp/p.json) size=$(jq -r '.solution.response' /tmp/p.json | wc -c)b"
            jq -r '.solution.response' /tmp/p.json | head -c 500 | tr -d '\n'; echo ""
          }

          # Feed public direct sports Congo
          test_url "smartdog feeds sp CG" "https://smartdog.meridianbet.com/feeds/sp/CG"
          test_url "smartdog feeds sp CG/football" "https://smartdog.meridianbet.com/feeds/sp/CG/football"

          # Init token endpoint
          test_url "online init" "https://online.meridianbet.com/betshop/api/v2/init"
          test_url "online init anonymous" "https://online.meridianbet.com/betshop/api/v2/user/anonymous"
          test_url "oauth token" "https://online.meridianbet.com/oauth/token"

          # Betshop API sport variations (58 = soccer commonly)
          test_url "online sport 58 sr" "https://online.meridianbet.com/betshop/api/v2/standard/sport/58/region"
          test_url "online sport 58 events" "https://online.meridianbet.com/betshop/api/v2/standard/sport/58/events"

          # viforbo variations
          test_url "viforbo standard sport 58" "https://viforbo.meridianbet.com/standard/sport/58"
          test_url "viforbo api v2 sports" "https://viforbo.meridianbet.com/api/v2/sports"
          test_url "viforbo betshop standard 58" "https://viforbo.meridianbet.com/betshop/api/v2/standard/sport/58"

          # Sports different IDs (foot could be 1, 58, or other in Meridianbet)
          test_url "online sport 1" "https://online.meridianbet.com/betshop/api/v2/standard/sport/1"

          # ProdOnline / ProdBetshop variants (sometimes used)
          test_url "prodbetshop sport 58" "https://online.meridianbet.com/prod-betshop/api/v2/standard/sport/58"

          # supergooal-hosted API (proxy?)
          test_url "supergooal betshop" "https://supergooal.cg/betshop/api/v2/standard/sport/58"
