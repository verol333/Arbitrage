name: Audit Volleyball Markets (7 books)
on: { workflow_dispatch: {} }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      byparr:
        image: ghcr.io/thephaseless/byparr:latest
        ports: ['8191:8191']
        options: --shm-size=1g
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Byparr
        run: |
          for i in {1..90}; do
            if curl -sf http://localhost:8191/docs >/dev/null 2>&1; then
              echo "OK Byparr ready after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Probe SuperGooal HTML + extract API URLs
        run: |
          echo "=== SuperGooal HTML full dump (chercher API URLs) ==="
          curl -s -X POST http://localhost:8191/v1 \
            -H 'Content-Type: application/json' \
            -d '{"cmd":"request.get","url":"https://supergooal.cg/fr/pari","maxTimeout":60000}' \
            > /tmp/sg.json
          echo "size: $(jq -r '.solution.response' /tmp/sg.json | wc -c)"
          echo ""
          echo "=== API URLs trouvées dans le HTML ==="
          jq -r '.solution.response' /tmp/sg.json | grep -oE 'https?://[a-zA-Z0-9\.\-]+\.(meridianbet|merbet)\.[a-z]+/[a-zA-Z0-9/\._\-]*' | sort -u | head -30
          echo ""
          echo "=== Fichiers .js chargés (peut contenir API base) ==="
          jq -r '.solution.response' /tmp/sg.json | grep -oE 'src="[^"]+\.js"' | head -10
          echo ""
          echo "=== data-*  attributs ==="
          jq -r '.solution.response' /tmp/sg.json | grep -oE 'data-api[^=]*="[^"]+"' | head -10

      - name: Probe endpoints Meridianbet candidats via Byparr
        run: |
          test_url() {
            local label="$1"; local url="$2"
            echo ""
            echo "=== $label ==="
            curl -s -X POST http://localhost:8191/v1 \
              -H 'Content-Type: application/json' \
              -d "{\"cmd\":\"request.get\",\"url\":\"$url\",\"maxTimeout\":30000}" \
              > /tmp/probe.json 2>&1 || { echo "curl failed"; return; }
            local http=$(jq -r '.solution.status' /tmp/probe.json 2>/dev/null)
            local size=$(jq -r '.solution.response' /tmp/probe.json 2>/dev/null | wc -c)
            echo "  HTTP=$http size=${size}b"
            jq -r '.solution.response' /tmp/probe.json 2>/dev/null | head -c 500 | tr -d '\n'
            echo ""
          }

          # Endpoints candidats basés sur ce qu'on voit dans le HTML
          test_url "viforbo sports" "https://viforbo.meridianbet.com/api/v1/sports?locale=fr"
          test_url "viforbo standard" "https://viforbo.meridianbet.com/standard/sport?locale=fr"
          test_url "merbet root" "https://merbet.com/"
          test_url "wsbo-online" "https://wsbo-online.meridianbet.com/"
          test_url "online.meridianbet API v2" "https://online.meridianbet.com/betshop/api/v2/standard/sport/58"
          test_url "supergooal API pari" "https://supergooal.cg/api/pari/sports"
          test_url "supergooal graphql" "https://supergooal.cg/api/graphql"

          # Domaines Meridianbet connus
          test_url "meridianbet online-api" "https://online.meridianbet.com/api/v1/sports"
          test_url "meridian bo-api" "https://bo-api.meridianbet.com/api/v1/sports"
