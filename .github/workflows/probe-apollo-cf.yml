name: Probe Apollo CF Worker
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Probe CF Worker Apollo
        run: node scripts/probe-apollo-cf.js
