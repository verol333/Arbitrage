name: Cartographie cross-book marches inhabituels
on: { workflow_dispatch: {} }
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: |
          if [ -f package.json ]; then npm install --production --no-audit --no-fund
          else cd arbitrage-service && npm install --production --no-audit --no-fund && cd .. && ln -sfn arbitrage-service/node_modules node_modules
          fi
      - name: Run cross-book map
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
          CASONGO_TOKEN: ${{ secrets.CASONGO_TOKEN }}
          TOP_MATCHES: '200'
          MATCH_BATCH: '6'
        run: node scripts/cross-book-market-map.js
      - name: Commit map
        run: |
          git config user.email actions@github.com
          git config user.name "GitHub Actions"
          git add docs/cross-book-market-map.md
          git commit -m "cross-book map auto-genere" || echo "nochanges"
          git push origin HEAD:main
