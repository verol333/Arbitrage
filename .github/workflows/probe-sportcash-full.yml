name: Probe — Sportcash catalogue complet

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-sportcash-full.js'
      - '.github/workflows/probe-sportcash-full.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run probe
        working-directory: .
        run: |
          mkdir -p probe-results
          node scripts/probe-sportcash-full.js 2>&1 | tee probe-results/sportcash-full.log
      - name: Commit log
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/sportcash-full.log
          git commit -m "Probe sportcash full run ${{ github.run_id }}" || echo "nothing"
          git push || true
