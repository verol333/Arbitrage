name: Probe — rapprochement des equipes (live)
on:
  workflow_dispatch:
    inputs:
      sport:
        description: 'Sport a sonder'
        required: false
        default: 'football'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Dependance ws a la racine (les sources src/ resolvent depuis la racine)
        working-directory: .
        run: npm install ws got-scraping --no-save
      - name: Sonde de rapprochement
        run: node probe-live-map.mjs
        env:
          PROBE_SPORT: ${{ github.event.inputs.sport }}
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          JINA_API_KEY_2: ${{ secrets.JINA_API_KEY_2 }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
