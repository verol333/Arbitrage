name: Probe — BetPawa via Scrape.do

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/probe-betpawa-scrapedo.js'
      - '.github/workflows/probe-betpawa-scrapedo.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run probe
        working-directory: .
        run: |
          mkdir -p probe-results
          node scripts/probe-betpawa-scrapedo.js 2>&1 | tee probe-results/betpawa-scrapedo.log
        env:
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
      - name: Commit results
        working-directory: .
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results/betpawa-scrapedo.log || true
          git commit -m "PROBE BetPawa Scrape.do : resultats run ${{ github.run_id }}" || echo "nothing to commit"
          git push || true
