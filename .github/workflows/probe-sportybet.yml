name: Probe SportyBet — teste variantes pcUpcomingEvents

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe 7 variantes
        run: node scripts/probe-sportybet.js
