name: Diag 5 books tennis

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/diag-5books-tennis.js'
      - '.github/workflows/diag-5books-tennis.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: arbitrage-service } }
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - run: npm install --production
      - working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run diag
        working-directory: .
        run: |
          mkdir -p probe-results
          node scripts/diag-5books-tennis.js 2>&1 | tee probe-results/diag-5books-tennis.log || true
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
      - name: Commit log
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f probe-results/diag-5books-tennis.log ]; then
            git add probe-results/diag-5books-tennis.log
            git commit -m "DIAG 5 books tennis ${{ github.run_id }}" || echo "nothing"
            git push || true
          fi
