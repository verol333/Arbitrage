name: Dump TENNIS mapping (7 books)

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/dump-tennis-mapping.js'
      - '.github/workflows/dump-tennis-mapping.yml'

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: arbitrage-service
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: arbitrage-service/node_modules
          key: npm-${{ hashFiles('arbitrage-service/package.json') }}
      - name: Install deps
        run: npm install --production
      - name: Link node_modules
        working-directory: .
        run: ln -sf arbitrage-service/node_modules node_modules
      - name: Run dump
        working-directory: .
        run: |
          mkdir -p probe-results
          node scripts/dump-tennis-mapping.js 2>&1 | tee probe-results/dump-tennis-mapping.log || true
        env:
          PROXY_MODE: ${{ secrets.PROXY_MODE }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          RESIDENTIAL_PROXY_URL: ${{ secrets.RESIDENTIAL_PROXY_URL }}
          CF_WORKER_PROXY_URL: ${{ secrets.CF_WORKER_PROXY_URL }}
          SCRAPE_DO_KEY: ${{ secrets.SCRAPE_DO_KEY }}
      - name: Commit dump
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f probe-results/dump-tennis-mapping.log ]; then
            # cap 2000 lines to avoid huge commit
            tail -n 2000 probe-results/dump-tennis-mapping.log > probe-results/dump-tennis-mapping.tail.log
            mv probe-results/dump-tennis-mapping.tail.log probe-results/dump-tennis-mapping.log
            git add probe-results/dump-tennis-mapping.log
            git commit -m "DUMP tennis mapping run ${{ github.run_id }}" || echo "nothing"
            git push || true
          fi
